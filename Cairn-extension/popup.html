<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cairn</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🪨 Cairn</h1>
            <p class="subtitle">Mark your knowledge journey</p>
        </header>
        
        <!-- 未登录视图 -->
        <main id="login-view" class="hidden">
            <p class="label">Sign in to start saving</p>
            <button id="open-web-btn" class="primary-btn">Sign in with Google →</button>
            <p class="hint">Opens Cairn in a new tab. Come back after signing in.</p>
            <div class="divider">or</div>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn" class="secondary-btn">Sign In with Email</button>
            <p id="login-status" class="status"></p>
        </main>
        
        <!-- 已登录视图 -->
        <main id="save-view" class="hidden">
            <div id="page-info">
                <p class="label">Current page</p>
                <p id="page-title" class="page-title">Loading...</p>
                <p id="page-url" class="page-url"></p>
            </div>
            
            <button id="save-btn" class="primary-btn">Save This Page</button>
            
            <p id="status" class="status"></p>
            
            <button id="logout-btn" class="text-btn">Sign Out</button>
        </main>
        
        <footer>
            <p>v0.2.0 — Week 2 Day 11</p>
        </footer>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
