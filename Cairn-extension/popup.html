<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cairn</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🪨 Cairn</h1>
            <p class="subtitle">Mark your knowledge journey</p>
        </header>

        <!-- 未登录视图 -->
        <main id="login-view" class="hidden">
            <p class="label">Sign in to start saving</p>
            <button id="google-btn" class="google-btn">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" fill="#34A853"/>
                    <path d="M3.964 10.71c-.18-.54-.282-1.117-.282-1.71s.102-1.17.282-1.71V4.958H.957C.347 6.173 0 7.548 0 9s.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                Sign in with Google
            </button>
            <div class="divider">or</div>
            <input type="email" id="email" placeholder="Email" />
            <input type="password" id="password" placeholder="Password" />
            <button id="login-btn" class="secondary-btn">Sign In with Email</button>
            <p id="login-status" class="status"></p>
        </main>

        <!-- 已登录视图 -->
        <main id="save-view" class="hidden">
            <div id="page-info">
                <p class="label">Current page</p>
                <p id="page-title" class="page-title">Loading...</p>
                <p id="page-url" class="page-url"></p>
            </div>

            <button id="save-btn" class="primary-btn">Save This Page</button>

            <p id="status" class="status"></p>

            <button id="logout-btn" class="text-btn">Sign Out</button>
        </main>

        <footer>
            <p>v0.3.0</p>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
